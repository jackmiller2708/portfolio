<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Contact</title>
  <desc id="desc">A scoped advisory contact flow for frontend systems work.</desc>
  <rect width="1200" height="630" fill="#fafafc"/>
  <rect x="72" y="72" width="1056" height="486" fill="#ffffff" stroke="#d9dde7" stroke-width="2" rx="8"/>
  <text x="112" y="154" fill="#17171c" font-family="Space Grotesk, Arial, sans-serif" font-size="54" font-weight="700">Start Contact</text>
  <text x="112" y="212" fill="#5e606a" font-family="Inter, Arial, sans-serif" font-size="28">Pick the first question, then send focused context.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="112" y="306" width="300" height="92" fill="#f2f4f8" stroke="#c72c73" rx="6"/>
    <text x="136" y="360" fill="#17171c">Audit</text>
    <rect x="452" y="306" width="300" height="92" fill="#f2f4f8" stroke="#d9dde7" rx="6"/>
    <text x="476" y="360" fill="#17171c">Stabilization</text>
    <rect x="792" y="306" width="300" height="92" fill="#f2f4f8" stroke="#d9dde7" rx="6"/>
    <text x="816" y="360" fill="#17171c">Advisory</text>
  </g>
  <text x="112" y="508" fill="#c72c73" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Keep the first inquiry small enough to answer well.</text>
</svg>

