<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Case Studies</title>
  <desc id="desc">Redacted and synthetic proof for frontend systems work.</desc>
  <rect width="1200" height="630" fill="#fafafc"/>
  <rect x="72" y="72" width="1056" height="486" fill="#ffffff" stroke="#d9dde7" stroke-width="2" rx="8"/>
  <text x="112" y="154" fill="#17171c" font-family="Space Grotesk, Arial, sans-serif" font-size="54" font-weight="700">Case Studies</text>
  <text x="112" y="212" fill="#5e606a" font-family="Inter, Arial, sans-serif" font-size="28">Constraints, decisions, tradeoffs, and outcomes.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="112" y="306" width="412" height="128" fill="#f2f4f8" stroke="#c72c73" rx="6"/>
    <text x="136" y="360" fill="#17171c">Problem</text>
    <text x="136" y="398" fill="#5e606a">Decision</text>
    <rect x="576" y="306" width="412" height="128" fill="#f2f4f8" stroke="#d9dde7" rx="6"/>
    <text x="600" y="360" fill="#17171c">Before</text>
    <text x="600" y="398" fill="#5e606a">After</text>
  </g>
  <text x="112" y="508" fill="#c72c73" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Proof stays synthetic, redacted, and public-safe.</text>
</svg>

